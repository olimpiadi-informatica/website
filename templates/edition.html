{% set path = ["pagine/edizione-", term.name, ".md"] | join %}
{% set page = get_page(path=path) %}

<div class="edition-header mb-4">
  <h1 id="edition-{{term.name}}" class="fw-bold mb-3">{{page.title | safe }}</h1>
  {% if page.content %}
    <div class="edition-description mb-4">
      {{page.content | safe }}
    </div>
  {% endif %}
</div>

{% set page_list = term.pages %}
{% include "post_list.html" %}
